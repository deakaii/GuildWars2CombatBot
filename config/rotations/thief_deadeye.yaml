# Thief / Deadeye rotation: Power Deadeye, Rifle (Snow Crows opener + rotation concept)
#
# Skill bar while kneeling (skill names from the GW2 API):
#   1  Deadly Aim; in stealth: Malicious Death's Judgment (the stealth attack)
#   3  Three Round Burst (4 initiative, no cooldown)
#   5  Kneel (toggle: pressing it again stands you up)
#   f1 Deadeye's Mark      f2 Steal Time (stealths you at 3+ malice)
#   6  Mercy (loses all malice, recharges Deadeye's Mark; ammo skill)
#   7  Shadow Flare (ground-targeted; flips to Shadow Swap)
#   8  Signet of Shadows (passive only, never pressed)
#   0  Shadow Meld (elite)
#
# Leave the game's auto-attack on: "auto" steps and any waiting are filled by it.
# Revealed isn't read from the screen yet: "after: {1: 3}" waits 3 s after the last stealth
# attack before stealthing again (Revealed's duration).

name: Power Deadeye

# Pressed even mid-cast; the sequence moves on as soon as they're pressed
instant: [f1, f2, 5, 6, 7, 0]

# Waits until affordable; a skill counts as cast once the amount drops
costs:
  3: {initiative: 4}
  1: {malice: 1}

double_tap:
  7: 0.25

auto_attack_seconds: 0.8

opener:
  - 5                                     # Kneel
  - f1                                    # 1. Deadeye's Mark -> Steal Time
  - f2
  - 7                                     # 2. Shadow Flare -> Three Round Burst x2 (+ Shadow Swap)
  - 3
  - 7                                     #    Shadow Swap
  - 3
  - {skill: f2, wait: {malice: 5}}        # 3. Steal Time -> Malicious Death's Judgment
  - 1
  - 3                                     # 4. Three Round Burst (+ Mercy) -> Steal Time
  - 6
  - f2
  - 3                                     # 5. Three Round Burst x2 (+ Deadeye's Mark)
  - f1
  - 3
  - {skill: f2, wait: {malice: 5}, after: {1: 3}}   # 6. Steal Time -> MDJ (+ Mercy)
  - 1
  - 6
  - 3                                     # 7. Three Round Burst -> Steal Time
  - f2
  - 3                                     # 8. Three Round Burst x2 (+ Deadeye's Mark)
  - f1
  - 3
  - {skill: f2, wait: {malice: 5}, after: {1: 3}}   # 9. Steal Time -> MDJ
  - 1

# After the opener: the first block whose "when" skills are all ready runs start to finish.
# Nothing ready -> auto-attacks until something is.
loop:
  - name: Mercy reset
    when: [f1, 6]
    steps:
      - 3                                 # Three Round Burst x2 (+ Deadeye's Mark)
      - f1
      - 3
      - {skill: f2, wait: {malice: 5}, after: {1: 3}}   # Steal Time -> MDJ (+ Mercy)
      - 1
      - 6
      - 3                                 # Three Round Burst -> Steal Time
      - f2
      - 3                                 # Three Round Burst (+ Deadeye's Mark)
      - f1
      - {auto: 1}                         # at least one auto-attack -> Steal Time -> MDJ
      - {skill: f2, wait: {malice: 5}, after: {1: 3}}
      - 1

  - name: Shadow Flare combo
    when: [7]
    steps:
      - 7                                 # Shadow Flare
      - 3                                 # Three Round Burst x2
      - 3
      - {skill: f2, wait: {malice: 5}, after: {1: 3}}   # autos while Revealed wears off -> Steal Time -> MDJ
      - 1

  - name: Shadow Meld intermission
    when: [0]
    steps:
      - {auto: 5}                         # Auto Attack x5
      - {skill: 0, wait: {malice: 5}}     # Shadow Meld -> MDJ
      - 1
      - 3                                 # Three Round Burst x2
      - 3
      - {skill: f2, wait: {malice: 5}, after: {1: 3}}   # autos while Revealed wears off -> Steal Time -> MDJ
      - 1
